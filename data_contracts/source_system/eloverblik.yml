kind: DataContract
apiVersion: v3.0.0
id: "urn:datacontract:eloverblik:metering-points"
status: active

name: "Eloverblik - Danish Electricity Consumption Data"
version: "1.0.0"
description:
  purpose: "Data contract for Danish electricity consumption data from Eloverblik Customer API"
  limitations: "Requires authentication token. Data availability depends on user's metering points. Rate limits apply."
  usage: "Extract electricity consumption time series data for energy analytics, billing, and consumption monitoring"

servers:
  - server: dev
    type: "rest_api"
    environment: "development"
    format: "json"
    customProperties:
      - property: loadtype
        value: "rest_api_ds"
      - property: connector_type
        value: "rest_api_ds"
      - property: secret_keys
        value:
          - "auth_token"
      - property: connector_config
        value:
          endpoint: "https://api.eloverblik.dk/customerapi/api"
          method: "GET"
          
          # OAuth2 refresh token authentication
          auth_type: "oauth2_refresh"
          auth_token: "{{spark.eloverblik-api-token}}"
          token_endpoint: "https://api.eloverblik.dk/customerapi/api/token"
          token_method: "GET"
          token_response_path: "result"
          
          # Additional headers required by Eloverblik API
          headers:
            Accept: "application/json"
            Content-Type: "application/json"
          
          pagination_type: "none"  # API returns all data for requested period
          data_path: "result"
          add_audit_columns: true
          rate_limit_delay: 1.0  # Respect API rate limits (1 second between requests)
          timeout: 60

schema:
  - name: MeteringPoints
    description: "List of metering points (electricity meters) associated with the customer"
    type: table
    customProperties:
      - property: scd_type
        value: 2  # Track changes to metering point metadata
      - property: keys
        value: ["meteringPointId"]
      - property: sequence_column
        value: "meteringPointId"
      - property: loadtype
        value: "rest_api_ds"
      - property: mode
        value: "batch"  # Full refresh for metering point metadata
      - property: table_name
        value: "meteringpoints/meteringpoints"
    properties:
      - name: meteringPointId
        description: "Unique identifier for the metering point (18-digit number)"
        logicalType: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
        classification: "confidential"
        example: "571313174012345678"
        pattern: "^[0-9]{18}$"
      
      - name: typeOfMP
        description: "Type of metering point (e.g., E17 for electricity consumption)"
        logicalType: string
        required: true
        tags:
          - "classification"
        classification: "public"
        example: "E17"
      
      - name: settlementMethod
        description: "Settlement method (D01=Profiled, E02=Non-profiled)"
        logicalType: string
        required: false
        tags:
          - "metadata"
        classification: "public"
        example: "E02"
      
      - name: meterReadingOccurrence
        description: "Meter reading frequency"
        logicalType: string
        required: false
        tags:
          - "metadata"
        classification: "public"
      
      - name: meterNumber
        description: "Physical meter number"
        logicalType: string
        required: false
        tags:
          - "identifier"
        classification: "confidential"
      
      - name: consumerStartDate
        description: "Date when consumer started at this metering point"
        logicalType: timestamp
        required: false
        tags:
          - "temporal"
        classification: "confidential"
      
      - name: streetCode
        description: "Street code for the metering point location"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: streetName
        description: "Street name for the metering point location"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: buildingNumber
        description: "Building number"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: floorId
        description: "Floor identifier"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: roomId
        description: "Room identifier"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: cityName
        description: "City name"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: postcode
        description: "Postal code"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
        pattern: "^[0-9]{4}$"
      
      - name: hasRelation
        description: "Whether the user has an active relation to this metering point"
        logicalType: boolean
        required: false
        tags:
          - "status"
        classification: "confidential"

  - name: TimeSeriesData
    description: "Hourly electricity consumption time series data"
    type: table
    customProperties:
      - property: scd_type
        value: 1  # Append-only for time series data
      - property: keys
        value: ["meteringPointId", "position"]
      - property: sequence_column
        value: "position"
      - property: loadtype
        value: "rest_api_ds"
      - property: mode
        value: "streaming"
      - property: timestamp_field
        value: "position"
      - property: initial_timestamp
        value: "2025-01-01T00:00:00"
      - property: table_name
        value: "meterdata/gettimeseries"
      - property: params
        value:
          # Parameters for time series extraction
          # Note: You'll need to customize this with actual metering point IDs
          # Format: {"meteringPoints": {"meteringPoint": ["571313174012345678"]}, "dateFrom": "2025-01-01", "dateTo": "2025-12-31"}
          aggregation: "Hour"  # Hour, Day, Month, or Year
    properties:
      - name: meteringPointId
        description: "Metering point identifier"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
          - "foreign_key"
        classification: "confidential"
        example: "571313174012345678"
      
      - name: position
        description: "Timestamp for the measurement period start (UTC)"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "primary_key"
          - "utc"
        classification: "public"
        example: "2025-12-01T00:00:00Z"
      
      - name: quantity
        description: "Electricity consumption quantity in kWh"
        type: double
        required: true
        tags:
          - "measure"
          - "consumption"
        classification: "confidential"
        example: 1.234
      
      - name: quality
        description: "Data quality indicator (e.g., Measured, Estimated)"
        type: string
        required: false
        tags:
          - "quality"
          - "metadata"
        classification: "public"
        example: "Measured"
      
      - name: unit
        description: "Unit of measurement (typically kWh)"
        type: string
        required: false
        tags:
          - "metadata"
        classification: "public"
        example: "kWh"
      
      - name: resolution
        description: "Time resolution (e.g., Hour, Day)"
        type: string
        required: false
        tags:
          - "temporal"
          - "metadata"
        classification: "public"
        example: "Hour"

