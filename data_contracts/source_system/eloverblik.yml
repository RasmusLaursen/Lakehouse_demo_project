#     description: "Eloverblik Portal"

# USAGE NOTES:
# 
# 1. Authentication:
#    - Store token: databricks secrets put --scope databricks-free-dev --key eloverblik-api-token
#    - Token format: JWT (shown in your Untitled-1 file)
#    - Token expiry: Check 'exp' claim in JWT (expires: 2026-12-09)
#
# 2. API Endpoints:
#    - Metering Points: GET /api/meteringpoints/meteringpoints
#    - Time Series: POST /api/meterdata/gettimeseries (requires JSON body with date range)
#    - Charges: POST /api/meterdata/getcharges
#
# 3. Time Series Extraction:
#    - Requires POST with JSON body: {"meteringPoints": {"meteringPoint": ["ID1", "ID2"]}, "dateFrom": "YYYY-MM-DD", "dateTo": "YYYY-MM-DD"}
#    - Start with MeteringPoints extraction to get IDs
#    - Then extract TimeSeriesData for those IDs
#
# 4. Rate Limits:
#    - Respect API rate limits (1 second delay configured)
#    - Monitor for 429 (Too Many Requests) responses
#
# 5. Data Classification:
#    - Metering point IDs and consumption data are CONFIDENTIAL
#    - Follow GDPR requirements for personal data handling
#    - Implement appropriate access controls in Unity Catalog
