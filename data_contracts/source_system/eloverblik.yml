kind: DataContract
apiVersion: v3.0.0
id: "urn:datacontract:eloverblik:metering-points"
status: active

name: "Eloverblik - Danish Electricity Consumption Data"
version: "1.0.0"
description:
  purpose: "Data contract for Danish electricity consumption data from Eloverblik Customer API"
  limitations: "Requires authentication token. Data availability depends on user's metering points. Rate limits apply."
  usage: "Extract electricity consumption time series data for energy analytics, billing, and consumption monitoring"

# SETUP INSTRUCTIONS:
# 1. Store your Eloverblik REFRESH TOKEN (JWT) in Databricks secrets:
#    databricks secrets put --scope databricks-free-dev --key eloverblik-api-token
#    Note: This is the long-lived refresh token, NOT the access token
#
# 2. The connector will automatically exchange the refresh token for an access token
#    using the /api/token endpoint before each API call
#
# 3. For DLT pipelines, add to pipeline configuration:
#    configuration:
#      spark.secrets.databricks-free-dev.token: "{{secrets/databricks-free-dev/eloverblik-api-token}}"

servers:
  - server: dev
    type: "rest_api"
    environment: "development"
    format: "json"
    customProperties:
      - property: loadtype
        value: "rest_api_ds"
      - property: connector_type
        value: "rest_api_ds"
      - property: secret_keys
        value:
          - "auth_token"
      - property: connector_config
        value:
          endpoint: "https://api.eloverblik.dk/customerapi/api"
          method: "GET"
          
          # OAuth2 refresh token authentication
          auth_type: "oauth2_refresh"
          auth_token: "{{spark.eloverblik-api-token}}"
          token_endpoint: "https://api.eloverblik.dk/customerapi/api/token"
          token_method: "GET"
          token_response_path: "result"
          
          # Additional headers required by Eloverblik API
          headers:
            Accept: "application/json"
            Content-Type: "application/json"
          
          pagination_type: "none"  # API returns all data for requested period
          data_path: "result"
          add_audit_columns: true
          rate_limit_delay: 1.0  # Respect API rate limits (1 second between requests)
          timeout: 60

schema:
  # Schema 1: Metering Points (Customer's electricity meters)
  - name: MeteringPoints
    description: "List of metering points (electricity meters) associated with the customer"
    type: table
    customProperties:
      - property: scd_type
        value: 2  # Track changes to metering point metadata
      - property: keys
        value: ["meteringPointId"]
      - property: sequence_column
        value: "meteringPointId"
      - property: loadtype
        value: "rest_api_ds"
      - property: mode
        value: "batch"  # Full refresh for metering point metadata
      - property: table_name
        value: "meteringpoints/meteringpoints"
    properties:
      - name: meteringPointId
        description: "Unique identifier for the metering point (18-digit number)"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
        classification: "confidential"
        example: "571313174012345678"
        pattern: "^[0-9]{18}$"
      
      - name: typeOfMP
        description: "Type of metering point (e.g., E17 for electricity consumption)"
        type: string
        required: true
        tags:
          - "classification"
        classification: "public"
        example: "E17"
      
      - name: settlementMethod
        description: "Settlement method (D01=Profiled, E02=Non-profiled)"
        type: string
        required: false
        tags:
          - "metadata"
        classification: "public"
        example: "E02"
      
      - name: meterReadingOccurrence
        description: "Meter reading frequency"
        type: string
        required: false
        tags:
          - "metadata"
        classification: "public"
      
      - name: meterNumber
        description: "Physical meter number"
        type: string
        required: false
        tags:
          - "identifier"
        classification: "confidential"
      
      - name: consumerStartDate
        description: "Date when consumer started at this metering point"
        type: timestamp
        required: false
        tags:
          - "temporal"
        classification: "confidential"
      
      - name: streetCode
        description: "Street code for the metering point location"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: streetName
        description: "Street name for the metering point location"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: buildingNumber
        description: "Building number"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: floorId
        description: "Floor identifier"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: roomId
        description: "Room identifier"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: cityName
        description: "City name"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: postcode
        description: "Postal code"
        type: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
        pattern: "^[0-9]{4}$"
      
      - name: hasRelation
        description: "Whether the user has an active relation to this metering point"
        type: boolean
        required: false
        tags:
          - "status"
        classification: "confidential"

