kind: DataContract
apiVersion: v3.0.0
id: "urn:datacontract:eloverblik:metering-points"
status: active

name: "Eloverblik - Danish Electricity Consumption Data"
version: "1.0.0"
description:
  purpose: "Data contract for Danish electricity consumption data from Eloverblik Customer API"
  limitations: "Requires authentication token. Data availability depends on user's metering points. Rate limits apply."
  usage: "Extract electricity consumption time series data for energy analytics, billing, and consumption monitoring"

servers:
  - server: dev
    type: "rest_api"
    environment: "development"
    format: "json"
    customProperties:
      - property: loadtype
        value: "rest_api"
      - property: connector_type
        value: "rest_api"
      - property: secret_keys
        value:
          - "auth_token"
      - property: connector_config
        value:
          endpoint: "https://api.eloverblik.dk/customerapi/api/"
          method: "GET"
          
          # OAuth2 refresh token authentication
          auth_type: "oauth2_refresh"
          auth_token: "{{spark.eloverblik-api-token}}"
          token_endpoint: "https://api.eloverblik.dk/customerapi/api/token"
          token_method: "GET"
          token_response_path: "result"
          
          # Additional headers required by Eloverblik API
          headers:
            Accept: "application/json"
            Content-Type: "application/json"
          
          pagination_type: "none"  # API returns all data for requested period
          add_audit_columns: true
          timeout: 60
          
          # Workflow configuration
          workflow_config:
            # Table name mapping for dependency resolution
            
            # Adaptive concurrency control
            initial_concurrent_calls: 3
            max_concurrent_calls: 10
            min_concurrent_calls: 1
            concurrency_adjustment_factor: 0.5  # Reduce by 50% on errors
            success_threshold_for_increase: 10   # Increase after 10 successful calls
            
            # Per-run caching
            cache_strategy: "per_run"
            cache_max_size: 10000  # Max number of parent records to cache
            
            # Rate limiting with backoff
            base_rate_limit_delay: 1.0
            max_rate_limit_delay: 60.0
            rate_limit_backoff_factor: 2.0
            
            # HTTPAdapter retry configuration per endpoint
            retry_config:
              meteringpoints:
                total_retries: 3
                backoff_factor: 1.0
                status_forcelist: [429, 500, 502, 503, 504]
                allowed_methods: ["GET", "POST"]
              meterdata:
                total_retries: 5  # More retries for time series data
                backoff_factor: 2.0
                status_forcelist: [429, 500, 502, 503, 504]
                allowed_methods: ["GET", "POST"]
              charges:
                total_retries: 4  # Moderate retries for charges data
                backoff_factor: 1.5
                status_forcelist: [429, 500, 502, 503, 504]
                allowed_methods: ["GET", "POST"]
            
            # Dependency chunking for parallel processing
            dependency_chunk_size: 50  # Process 50 metering points per partition

schema:
  - name: MeteringPoints
    description: "List of metering points (electricity meters) associated with the customer"
    type: table
    customProperties:
      - property: scd_type
        value: 2  # Track changes to metering point metadata
      - property: keys
        value: ["meteringPointId"]
      - property: sequence_column
        value: "meteringPointId"
      - property: loadtype
        value: "eloverblik_api"
      - property: mode
        value: "streaming"
      - property: timestamp_field
        value: "consumerStartDate"
      - property: initial_timestamp
        value: "2025-01-01"
      - property: table_name
        value: "meteringpoints/meteringpoints"
      - property: provides_dependencies
        value: ["meteringPointId"]  # Fields available for dependent calls
      - property: data_path
        value: "result"
      - property: method
        value: "GET"        
    properties:
      - name: meteringPointId
        description: "Unique identifier for the metering point (18-digit number)"
        logicalType: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
        classification: "confidential"
        example: "571313174012345678"
        pattern: "^[0-9]{18}$"
      
      - name: typeOfMP
        description: "Type of metering point (e.g., E17 for electricity consumption)"
        logicalType: string
        required: true
        tags:
          - "classification"
        classification: "public"
        example: "E17"
      
      - name: settlementMethod
        description: "Settlement method (D01=Profiled, E02=Non-profiled)"
        logicalType: string
        required: false
        tags:
          - "metadata"
        classification: "public"
        example: "E02"
      
      - name: meterReadingOccurrence
        description: "Meter reading frequency (e.g., PT1H for hourly)"
        logicalType: string
        required: false
        tags:
          - "metadata"
        classification: "public"
        example: "PT1H"
      
      - name: firstConsumerPartyName
        description: "Name of primary consumer at this metering point"
        logicalType: string
        required: false
        tags:
          - "consumer"
        classification: "confidential"
      
      - name: secondConsumerPartyName
        description: "Name of secondary consumer at this metering point"
        logicalType: string
        required: false
        tags:
          - "consumer"
        classification: "confidential"
      
      - name: meterNumber
        description: "Physical meter number"
        logicalType: string
        required: false
        tags:
          - "identifier"
        classification: "confidential"
      
      - name: consumerStartDate
        description: "Date when consumer started at this metering point"
        logicalType: string
        required: false
        tags:
          - "temporal"
        classification: "confidential"
        example: "2025-06-12T22:00:00.000Z"
      
      - name: streetCode
        description: "Street code for the metering point location"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: streetName
        description: "Street name for the metering point location"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: buildingNumber
        description: "Building number"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: floorId
        description: "Floor identifier"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: roomId
        description: "Room identifier"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: citySubDivisionName
        description: "City subdivision or district name"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: municipalityCode
        description: "Municipality code"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "public"
        example: "740"
      
      - name: locationDescription
        description: "Additional location description"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: cityName
        description: "City name"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
      
      - name: postcode
        description: "Postal code"
        logicalType: string
        required: false
        tags:
          - "geographic"
        classification: "confidential"
        pattern: "^[0-9]{4}$"
        example: "8600"
      
      - name: balanceSupplierName
        description: "Name of the balance supplier/energy company"
        logicalType: string
        required: false
        tags:
          - "supplier"
        classification: "public"
        example: "Strømlinet A/S"
      
      - name: hasRelation
        description: "Whether the user has an active relation to this metering point"
        logicalType: boolean
        required: false
        tags:
          - "status"
        classification: "confidential"
      
      - name: consumerCVR
        description: "CVR number (company registration) of consumer"
        logicalType: string
        required: false
        tags:
          - "identifier"
        classification: "confidential"
      
      - name: dataAccessCVR
        description: "CVR number with data access rights"
        logicalType: string
        required: false
        tags:
          - "identifier"
        classification: "confidential"
      
      - name: childMeteringPoints
        description: "List of child metering points (if any)"
        logicalType: array
        required: false
        tags:
          - "relationship"
        classification: "confidential"

  - name: TimeSeriesData
    description: "Hourly electricity consumption time series data"
    type: table
    customProperties:
      - property: scd_type
        value: 1  # Append-only for time series data
      - property: keys
        value: ["meteringPointId","period_start" , "position"]
      - property: sequence_column
        value: "position"
      - property: loadtype
        value: "rest_api"
      - property: mode
        value: "streaming"  # Batch with append (custom datasources not supported for streaming)
      - property: timestamp_field
        value: "position"
      - property: initial_timestamp
        value: "2025-08-01"
      - property: table_name
        value: "meterdata/gettimeseries/{dateFrom}/{dateTo}/{aggregation}"
      - property: dependency_table
        value: "meteringpoints/meteringpoints"
      - property: method
        value: "POST"  # Use POST for body parameters
      - property: depends_on
        value: "MeteringPoints"
      - property: dependency_mapping
        value:
          meteringPointId: "meteringPointId"  # Map parent field to parameter
      - property: body_params_template
        value:
          meteringPoints:
            meteringPoint:
               "body_params"
      - property: static_body_params
        value:
          # Static parameters in body (empty, all params go to URL path)
      - property: url_params_template
        value:
          dateFrom: "2025-01-01"
          dateTo: "2025-12-18"
          aggregation: "Actual"  # Hour, Day, Month, or Year
      - property: data_path
        value: "result.MyEnergyData_MarketDocument.TimeSeries.Period.Point"
      - property: field_mapping
        value:
          "out_Quantity.quantity": "quantity"
          "out_Quantity.quality": "quality"
          "mRID": "meteringPointId"
          "timeInterval.start": "period_start"
          "timeInterval.end": "period_end"
      - property: include_parent_context
        value: true
    properties:
      - name: meteringPointId
        description: "Metering point identifier"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
          - "foreign_key"
        classification: "confidential"
        example: "571313174012345678"
      
      - name: position
        description: "Position/hour index in the period (1-based)"
        type: string
        required: true
        tags:
          - "temporal"
          - "primary_key"
        classification: "public"
        example: "1"
      
      - name: quantity
        description: "Electricity consumption quantity in kWh"
        type: string
        required: true
        tags:
          - "measure"
          - "consumption"
        classification: "confidential"
        example: "1.234"
      
      - name: quality
        description: "Data quality indicator (e.g., Measured, Estimated)"
        type: string
        required: false
        tags:
          - "quality"
          - "metadata"
        classification: "public"
        example: "Measured" 
      
      - name: period_start
        description: "Start timestamp of the period"
        type: string
        required: false
        tags:
          - "temporal"
        classification: "public"
      
      - name: period_end
        description: "End timestamp of the period"
        type: string
        required: false
        tags:
          - "temporal"
        classification: "public"

      - name: resolution
        description: "Time resolution of the period (e.g., PT1H for hourly)"
        type: string
        required: false
        tags:
          - "temporal"
          - "metadata"
        classification: "public"

