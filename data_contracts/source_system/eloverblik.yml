      - property: field_mapping
        value:
          "meteringPointId": "meteringPointId"
          "subscriptions": "subscriptions"
          "tariffs": "tariffs"
          "fees": "fees"
      - property: include_parent_context
        value: true
    properties:
      - name: meteringPointId
        description: "Metering point identifier"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
        classification: "confidential"
      
      - name: subscriptions
        description: "Subscription charges as JSON array. Each element has name, description, owner, validFromDate, validToDate, price, quantity, periodType."
        type: string
        required: false
        tags:
          - "charges"
        classification: "confidential"
      
      - name: tariffs
        description: "Tariff charges as JSON array. Each element has name, description, owner, validFromDate, validToDate, periodType, and prices[] array of position/price pairs."
        type: string
        required: false
        tags:
          - "charges"
        classification: "confidential"
      
      - name: fees
        description: "Fee charges as JSON array. Each element has name, description, owner, validFromDate, validToDate, price, quantity."
        type: string
        required: false
        tags:
          - "charges"
        classification: "confidential"

