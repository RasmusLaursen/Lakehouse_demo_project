  - name: Forecasts_5Min
    description: "5-minute interval forecasts for renewable energy production (wind, solar)"
    type: table
    customProperties:
      - property: scd_type
        value: 1
      - property: keys
        value: ["Minutes5UTC", "PriceArea", "ForecastType"]
      - property: sequence_column
        value: "Minutes5UTC"
      - property: loadtype
        value: "rest_api_ds"
      - property: mode
        value: "streaming"
      - property: table_name
        value: "Forecasts_5Min"
      - property: timestamp_field
        value: "Minutes5UTC"
      - property: timestamp_param
        value: "start"
      - property: initial_timestamp
        value: "2025-11-01T00:00:00"
      - property: pagination_config
        value:
          limit: 10000
          offset_param: "offset"
          limit_param: "limit"
          total_records: 3883219
      - property: params
        value:
          sort: "Minutes5UTC DESC"
    properties:
      - name: Minutes5UTC
        description: "5-minute forecast interval timestamp in UTC"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "primary_key"
          - "utc"
        classification: "public"
        example: "2025-12-11T22:55:00"
      
      - name: Minutes5DK
        description: "5-minute forecast interval timestamp in Danish time zone"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "local_time"
        classification: "public"
        example: "2025-12-11T23:55:00"
      
      - name: PriceArea
        description: "Danish electricity price area (DK1 or DK2)"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
          - "geographic"
        classification: "public"
        example: "DK1"
        pattern: "^DK[12]$"
      
      - name: ForecastType
        description: "Type of renewable energy forecast (Offshore Wind, Onshore Wind, Solar)"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
          - "category"
        classification: "public"
        example: "Offshore Wind"
      
      - name: ForecastDayAhead
        description: "Day-ahead forecast production in MW"
        type: double
        required: false
        tags:
          - "metric"
          - "power"
          - "forecast"
        classification: "public"
        example: "713.000000"
        minimum: 0.0
      
      - name: Forecast5Hour
        description: "5-hour ahead forecast production in MW"
        type: double
        required: false
        tags:
          - "metric"
          - "power"
          - "forecast"
        classification: "public"
        example: "700.000000"
        minimum: 0.0
      
      - name: Forecast1Hour
        description: "1-hour ahead forecast production in MW"
        type: double
        required: false
        tags:
          - "metric"
          - "power"
          - "forecast"
        classification: "public"
        example: "720.000000"
        minimum: 0.0
      
      - name: ForecastCurrent
        description: "Current/most recent forecast production in MW"
        type: double
        required: false
        tags:
          - "metric"
          - "power"
          - "forecast"
        classification: "public"
        example: "707.000000"
        minimum: 0.0
      
      - name: TimestampUTC
        description: "Timestamp when forecast was made in UTC"
        type: timestamp
        required: false
        tags:
          - "temporal"
          - "utc"
          - "metadata"
        classification: "public"
        example: "2025-12-10T20:35:25"
      
      - name: TimestampDK
        description: "Timestamp when forecast was made in Danish time zone"
        type: timestamp
        required: false
        tags:
          - "temporal"
          - "local_time"
          - "metadata"
        classification: "public"
        example: "2025-12-10T21:35:25"

