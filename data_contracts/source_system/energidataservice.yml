kind: DataContract
apiVersion: v3.0.0
id: "urn:datacontract:energidataservice:re-coverage-municipality"
status: active

name: "Energy Data Service - RE Coverage Municipality"
version: "1.0.0"
description:
  purpose: "Data contract for renewable energy coverage data per municipality from Danish Energy Data Service"
  limitations: "Public data from Energinet. No authentication required. Data updates hourly."
  usage: "Data can be used for renewable energy analytics, municipality comparison, and sustainability reporting"

servers:
  - server: dev
    type: "rest_api"
    environment: "development"
    format: "json"
    customProperties:
      - property: loadtype
        value: "rest_api_ds"
      - property: connector_type
        value: "rest_api_ds"
      - property: connector_config
        value:
          endpoint: "https://api.energidataservice.dk/dataset"
          method: "GET"
          auth_type: "none"
          pagination_type: "offset"
          data_path: "records"
          add_audit_columns: true
          rate_limit_delay: 0.1  # 100ms delay between requests

schema:
  - name: ReCoverageMunicipality
    description: "Hourly renewable energy coverage data per Danish municipality"
    type: table
    customProperties:
      - property: scd_type
        value: 1
      - property: keys
        value: ["HourUTC", "MunicipalityNo"]
      - property: sequence_column
        value: "HourUTC"
      - property: loadtype
        value: "rest_api_ds"
      - property: mode
        value: "streaming"
      - property: table_name
        value: "ReCoverageMunicipality"
      - property: timestamp_field
        value: "HourUTC"
      - property: timestamp_param
        value: "start"
      - property: initial_timestamp
        value: "2025-11-01T00:00:00"
      - property: pagination_config
        value:
          limit: 10000
          offset_param: "offset"
          limit_param: "limit"
          total_records: 9377522
      - property: params
        value:
          sort: "HourUTC DESC"
    properties:
      - name: HourUTC
        description: "Timestamp in UTC for the hourly measurement"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "primary_key"
          - "utc"
        classification: "public"
        example: "2025-12-01T22:00:00"
      
      - name: HourDK
        description: "Timestamp in Danish time zone (CET/CEST) for the hourly measurement"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "local_time"
        classification: "public"
        example: "2025-12-01T23:00:00"
      
      - name: MunicipalityNo
        description: "Danish municipality number (kommunenummer)"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
          - "geographic"
        classification: "public"
        example: "101"
        pattern: "^[0-9]{3}$"
      
      - name: REshare
        description: "Renewable energy share as percentage of total consumption for the hour"
        type: double
        required: true
        tags:
          - "metric"
          - "percentage"
          - "renewable"
        classification: "public"
        example: "9.264297"
        minimum: 0.0
      
      - name: REekWhKeep
        description: "Renewable energy in kWh that stays within the municipality"
        type: double
        required: true
        tags:
          - "metric"
          - "energy"
          - "kwh"
        classification: "public"
        example: "22531.773438"
        minimum: 0.0
      
      - name: ConsumptionkWh
        description: "Total electricity consumption in kWh for the municipality during the hour"
        type: double
        required: true
        tags:
          - "metric"
          - "energy"
          - "kwh"
          - "consumption"
        classification: "public"
        example: "243210.828125"
        minimum: 0.0

