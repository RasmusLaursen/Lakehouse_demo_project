  - name: DayAheadPrices
    description: "Day-ahead electricity spot prices for Danish and neighboring price areas"
    type: table
    customProperties:
      - property: scd_type
        value: 1  # Append-only for time series data
      - property: keys
        value: ["TimeUTC", "PriceArea"]
      - property: sequence_column
        value: "TimeUTC"
      - property: loadtype
        value: "eloverblik_api"
      - property: mode
        value: "streaming"
      - property: timestamp_field
        value: "TimeUTC"
      - property: initial_timestamp
        value: "2025-01-01"
      - property: days_per_batch
        value: 7
      - property: table_name
        value: "dataset/DayAheadPrices"
      - property: method
        value: "GET"
      - property: url_params_template
        value:
          start: "2025-01-01"
          end: "2026-12-31"
          limit: 0
      - property: data_path
        value: "records"
    properties:
      - name: TimeUTC
        description: "Timestamp in UTC"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "primary_key"
        classification: "public"
        example: "2026-02-01T22:45:00"
      
      - name: TimeDK
        description: "Timestamp in Danish time"
        type: timestamp
        required: false
        tags:
          - "temporal"
        classification: "public"
        example: "2026-02-01T23:45:00"
      
      - name: PriceArea
        description: "Price area code (DK1, DK2, DE, etc.)"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
          - "geography"
        classification: "public"
        example: "DK1"
      
      - name: DayAheadPriceEUR
        description: "Day-ahead electricity price in EUR per MWh"
        type: decimal
        required: false
        tags:
          - "price"
          - "currency"
        classification: "public"
        example: "76.74"
      
      - name: DayAheadPriceDKK
        description: "Day-ahead electricity price in DKK per MWh"
        type: decimal
        required: false
        tags:
          - "price"
          - "currency"
        classification: "public"
        example: "573.05"

