kind: DataContract
apiVersion: v3.0.0
id: "urn:datacontract:example:secure-api"
status: active

name: "Example: REST API with Secret Authentication"
version: "1.0.0"
description:
  purpose: "Example data contract demonstrating secret integration for REST API authentication"
  limitations: "This is a template - replace with your actual API configuration"
  usage: "Copy this example and replace endpoint, scope, and key names with your actual values"

# IMPORTANT: Before using secrets, you must:
# 1. Store secrets in Databricks secret scope:
#    databricks secrets create-scope api-secrets
#    databricks secrets put api-secrets my-api-token
#
# 2. For DLT pipelines, configure in pipeline settings:
#    {
#      "configuration": {
#        "spark.secrets.api-secrets.token": "{{secrets/api-secrets/my-api-token}}"
#      }
#    }

servers:
  - server: dev
    type: "rest_api"
    environment: "development"
    format: "json"
    customProperties:
      - property: loadtype
        value: "rest_api_ds"
      - property: connector_type
        value: "rest_api_ds"
      - property: connector_config
        value:
          endpoint: "https://api.example.com/v1/data"
          method: "GET"
          
          # OPTION 1: Secret reference (recommended)
          # Format: secret://scope/key
          auth_type: "bearer"
          auth_token: "secret://api-secrets/my-api-token"
          
          # OPTION 2: API Key authentication
          # auth_type: "api_key"
          # auth_token: "secret://api-secrets/my-api-key"
          # auth_header: "X-API-Key"
          
          # OPTION 3: Alternative secret format (DLT style)
          # auth_token: "{{secrets/api-secrets/my-api-token}}"
          
          pagination_type: "offset"
          data_path: "data"
          add_audit_columns: true
          rate_limit_delay: 0.5

schema:
  - name: ExampleData
    description: "Example schema for API with authentication"
    type: table
    customProperties:
      - property: scd_type
        value: 1
      - property: keys
        value: ["id"]
      - property: loadtype
        value: "rest_api_ds"
      - property: mode
        value: "streaming"
      - property: timestamp_field
        value: "created_at"
      - property: initial_timestamp
        value: "2025-01-01T00:00:00"
      - property: pagination_config
        value:
          limit: 1000
          offset_param: "offset"
          limit_param: "limit"
      - property: params
        value:
          sort: "created_at DESC"
    properties:
      - name: id
        description: "Record identifier"
        type: string
        required: true
        tags:
          - "identifier"
          - "primary_key"
      
      - name: created_at
        description: "Record creation timestamp"
        type: timestamp
        required: true
        tags:
          - "temporal"
          - "utc"
      
      - name: data
        description: "Payload data"
        type: string
        required: false

# Configuration Instructions:
# 
# 1. Create secret scope (one-time setup):
#    databricks secrets create-scope --scope api-secrets
#
# 2. Store your API token:
#    databricks secrets put --scope api-secrets --key my-api-token
#
# 3. For DLT pipelines, add to resources/pipelines/your_pipeline.yml:
#    configuration:
#      spark.secrets.api-secrets.token: "{{secrets/api-secrets/my-api-token}}"
#
# 4. For notebooks/jobs, no additional config needed - secrets work automatically
#
# 5. Replace "secret://api-secrets/my-api-token" with your scope/key names
