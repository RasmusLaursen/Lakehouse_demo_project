targets:
  developer:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development

    workspace:
     host: https://dbc-e3d11267-f1e6.cloud.databricks.com 
     artifact_path: /Volumes/shared/${var.environment}_${workspace.current_user.short_name}_shared_resources/wheel_location/

    variables:
      volumepath: /Volumes/${resources.schemas.shared_schema.catalog_name}/${resources.schemas.shared_schema.name}/wheel_location
      environment: dev
      raw_catalog: raw_dev
      base_catalog: base_dev
      landing_catalog: landing_dev
      enriched_catalog: enriched_dev
      curated_catalog: curated_dev