variables:
  environment:
    default: dev

resources:
  pipelines:
    opensky_pipeline:
      name: opensky_pipeline_${var.environment}
      # Origin values mirror data_contracts/source_system/opensky.yml
      tags:
        source_system: opensky
        data_contract: "urn:datacontract:opensky:aircraft-states"
        source_type: rest_api
        source_origin: "https://opensky-network.org/api/"
      catalog: ${resources.schemas.opensky_raw_schema.catalog_name}
      schema: ${resources.schemas.opensky_raw_schema.name}
      
      libraries:
        - glob:
            include: ../../src/solution/raw/raw_ingest_opensky.py
        - glob:
            include: ../../src/solution/base/base_ingest_opensky.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
        environment: ${var.environment}

        catalogs: ${var.catalogs}
        
        schemas: | 
          {
            "opensky_raw_schema": "${resources.schemas.opensky_raw_schema.name}",
            "opensky_base_schema": "${resources.schemas.opensky_base_schema.name}"
          }

      serverless: true
      channel: CURRENT
      continuous: false
