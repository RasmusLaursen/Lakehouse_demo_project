customer:
  - check:
      arguments:
        column: customer_id
        max_limit: 100
        min_limit: 1
      function: is_in_range
    criticality: warn
    name: customer_id_is_null
  - check:
      arguments:
        column: account_manager
      function: is_not_null
    criticality: error
    name: account_manager_is_null
  - check:
      arguments:
        column: last_purchase_date
      function: is_not_null
    criticality: error
    name: last_purchase_date_is_null
  - check:
      arguments:
        column: loyalty_tier_id
      function: is_not_null
    criticality: error
    name: loyalty_tier_id_is_null
  - check:
      arguments:
        column: name
      function: is_not_null
    criticality: error
    name: name_is_null
  - check:
      arguments:
        column: number_of_purchases
      function: is_not_null
    criticality: error
    name: number_of_purchases_is_null
  - check:
      arguments:
        column: number_of_purchases
        max_limit: 100
        min_limit: 1
      function: is_in_range
    criticality: error
    name: number_of_purchases_isnt_in_range
  - check:
      arguments:
        column: phone_number
      function: is_not_null
    criticality: error
    name: phone_number_is_null
  - check:
      arguments:
        column: postal_code
      function: is_not_null
    criticality: error
    name: postal_code_is_null
  - check:
      arguments:
        column: preferred_payment_method_id
      function: is_not_null
    criticality: error
    name: preferred_payment_method_id_is_null
  - check:
      arguments:
        column: total_spend
      function: is_not_null
    criticality: error
    name: total_spend_is_null