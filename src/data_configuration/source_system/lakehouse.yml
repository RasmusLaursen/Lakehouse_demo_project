source_system_name: lakehouse
load_type: volume_autoloader
file_type: parquet
objects:
  customer:
    keys:
      - customer_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 2
    track_history_column_list:
      - last_login
      - email
      - phone_number
      - customer_name    
    track_history_except_column_list:
      - _metadata
  lakehouse:
    keys:
      - lakehouse_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1  
  lakehouse_rentals:
    keys:
      - rental_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1  
    backfill: lakehouse_rentals_historic
  seller:
    keys:
      - seller_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1
  loyalty_tier:
    keys:
      - loyalty_tier_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1
  payment_method:
    keys:
      - payment_method_id  
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1
  meta_region:
    keys:
      - region_name_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1
  meta_lakehouses:
    keys:
      - lakehouse_name_id
    sequence_column: _metadata_ldp["ingest_timestamp"]
    stored_as_scd_type: 1