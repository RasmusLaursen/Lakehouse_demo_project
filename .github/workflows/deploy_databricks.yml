# Template to run hatch commands with databricks configured
name: hatch run with databricks configured
on:
  workflow_call:
    inputs:
      enviroment:
        description: 'The environment to deploy to (e.g., dev, prod)'
        required: true
        type: string
      workspace-setup:
        description: Json object containing workspace setup details
        required: false
        type: string
      
permissions:
  contents: read
  id-token: write

jobs: 
  hatch:
    name: Run hatch command
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        shell: bash
        name: Install Databricks CLI

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # 3.14 lacks pydantic-core wheels for our pinned deps; matches Databricks runtime
          python-version: '3.12'
      
      - run: python -m pip install pipx
        shell: bash
        name: Install pipx

      - run: python -m pipx ensurepath
        shell: bash
        name: Ensure pipx is in PATH

      - run: python -m pipx install hatch
        shell: bash
        name: Install hatch with pipx
      
      - run: python -m pipx inject hatch click==8.2.1 --force
        shell: bash
        name: Fix click version for hatch

      - name: Databrikcs bundle deploy - ${{ inputs.enviroment }}
        env:
          DATABRICKS_HOST: ${{ fromJson(vars.workspace_setup)[inputs.enviroment].host }}
          DATABRICKS_CLIENT_ID: ${{ fromJson(vars.workspace_setup)[inputs.enviroment]['service-principal'] }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          BUNDLE_VAR_environment: ${{ inputs.enviroment }}
          BUNDLE_VAR_run_as: ${{ fromJson(vars.workspace_setup)[inputs.enviroment]['service-principal'] }}
        run: databricks bundle deploy --target ${{ inputs.enviroment }}
        shell: bash